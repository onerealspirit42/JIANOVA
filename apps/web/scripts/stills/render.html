<!doctype html>
<!--
  Studio renderer for the home page's shoe stills. Opened by render-stills.mjs
  in headless Chromium; not part of the website. It loads the same GLB and the
  same part-colouring material as the 3D designer, so the pictures and the
  designer always show the same shoe.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { HorizontalBlurShader } from "three/addons/shaders/HorizontalBlurShader.js";
import { VerticalBlurShader } from "three/addons/shaders/VerticalBlurShader.js";
import { FullScreenQuad } from "three/addons/postprocessing/Pass.js";
import { applyShoeMaterial, SHOE_PARTS } from "/src/features/configurator/shoe-material.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.8;

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-3, 6, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.7);
rim.position.set(4, 3, -5);
scene.add(rim);

const params = new URLSearchParams(location.search);
const modelUrl = params.get("m") ?? "/public/models/shoe.glb";
// ?turn=1: the shoe turns on a turntable (spec.rotationY), so its shadow needs a square ground.
const turntable = params.get("turn") === "1";
const gltf = await new GLTFLoader().loadAsync(modelUrl);
const shoe = gltf.scene;
let mesh;
shoe.traverse((o) => { if (o.isMesh) mesh = o; });
const paint = applyShoeMaterial(mesh);
scene.add(shoe);
const box = new THREE.Box3().setFromObject(shoe);
const size = box.getSize(new THREE.Vector3());

/**
 * A soft contact shadow, as drei's ContactShadows makes it: the shoe seen
 * from the ground up, darker where it is closer to the ground, then blurred.
 */
function contactShadow({ width, depth, far, blur, opacity, resolution = 1024, color = "#0b0910" }) {
  const rt = new THREE.WebGLRenderTarget(resolution, resolution);
  const rtBlur = new THREE.WebGLRenderTarget(resolution, resolution);
  rt.texture.generateMipmaps = rtBlur.texture.generateMipmaps = false;
  const camera = new THREE.OrthographicCamera(-width / 2, width / 2, depth / 2, -depth / 2, 0, far);
  camera.up.set(0, 0, 1);
  camera.lookAt(0, 1, 0);
  const depthMaterial = new THREE.MeshDepthMaterial();
  depthMaterial.depthTest = depthMaterial.depthWrite = false;
  depthMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.ucolor = { value: new THREE.Color(color) };
    shader.fragmentShader = shader.fragmentShader
      .replace("void main() {", "uniform vec3 ucolor;\nvoid main() {")
      .replace("vec4( vec3( 1.0 - fragCoordZ ), opacity );", "vec4( ucolor, ( 1.0 - fragCoordZ ) );");
  };
  const h = new THREE.ShaderMaterial(HorizontalBlurShader);
  const v = new THREE.ShaderMaterial(VerticalBlurShader);
  const quad = new FullScreenQuad();
  const pass = (amount) => {
    quad.material = h;
    h.uniforms.tDiffuse.value = rt.texture;
    h.uniforms.h.value = amount / resolution;
    renderer.setRenderTarget(rtBlur);
    quad.render(renderer);
    quad.material = v;
    v.uniforms.tDiffuse.value = rtBlur.texture;
    v.uniforms.v.value = amount / resolution;
    renderer.setRenderTarget(rt);
    quad.render(renderer);
  };
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth).rotateX(Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: rt.texture, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }),
  );
  plane.position.y = 0.001;
  return {
    plane,
    update() {
      plane.visible = false;
      scene.overrideMaterial = depthMaterial;
      renderer.setRenderTarget(rt);
      renderer.setClearColor(0x000000, 0);
      renderer.clear();
      renderer.render(scene, camera);
      scene.overrideMaterial = null;
      pass(blur);
      pass(blur * 0.4);
      renderer.setRenderTarget(null);
      plane.visible = true;
    },
  };
}

const shadow = turntable
  ? contactShadow({ width: size.x * 1.25, depth: size.x * 1.25, far: 0.55, blur: 6, opacity: 0.7, resolution: 2048 })
  : contactShadow({ width: size.x * 1.2, depth: size.z * 1.9, far: 0.55, blur: 6, opacity: 0.7 });
scene.add(shadow.plane);

/**
 * spec: { width, height, colors: {part: hex}, highlight?: part,
 *         camera: [x,y,z], target: [x,y,z], fov }
 * Returns a PNG data URL with a transparent background.
 */
// The shoe turns about the vertical axis through its centre (the turntable frames).
const centre = box.getCenter(new THREE.Vector3());
const pivot = new THREE.Group();
pivot.position.set(centre.x, 0, centre.z);
scene.add(pivot);
pivot.add(shoe);
shoe.position.set(-centre.x, 0, -centre.z);

window.renderStill = (spec) => {
  pivot.rotation.y = spec.rotationY ?? 0;
  SHOE_PARTS.forEach((part, i) => paint.setColor(i, spec.colors[part]));
  paint.glow(spec.highlight ? SHOE_PARTS.indexOf(spec.highlight) : -1, spec.highlight ? 0.45 : 0);
  shadow.update();
  renderer.setSize(spec.width, spec.height, false);
  const camera = new THREE.PerspectiveCamera(spec.fov ?? 20, spec.width / spec.height, 0.1, 100);
  camera.position.set(...spec.camera);
  camera.lookAt(new THREE.Vector3(...spec.target));
  renderer.render(scene, camera);
  // (raw: only render, for a caller that reads the canvas itself)
  if (spec.raw) return null;
  if (spec.box) {
    // The frame as rendered, with the box round the shoe and its shadow (alpha above 24).
    const c = document.createElement("canvas");
    c.width = spec.width; c.height = spec.height;
    const g = c.getContext("2d");
    g.drawImage(renderer.domElement, 0, 0);
    const image = g.getImageData(0, 0, c.width, c.height);
    const { data } = image;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++)
      for (let x = 0; x < c.width; x++) {
        const a = (y * c.width + x) * 4 + 3;
        // the shadow's faint tails (alpha 1 to 3) would draw a ghost of the ground's square on a light page
        if (data[a] <= 3) { data[a - 3] = data[a - 2] = data[a - 1] = data[a] = 0; continue; }
        if (data[a] > 24) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    g.putImageData(image, 0, 0);
    return { png: c.toDataURL("image/png"), box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1] };
  }
  if (!spec.trim) return renderer.domElement.toDataURL("image/png");

  // Trim to the shoe and its shadow (alpha above a small threshold), keeping
  // `spec.trim` (a share of the size) as a margin on every side.
  const c = document.createElement("canvas");
  c.width = spec.width;
  c.height = spec.height;
  const g = c.getContext("2d");
  g.drawImage(renderer.domElement, 0, 0);
  const { data } = g.getImageData(0, 0, c.width, c.height);
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < c.width; x++)
      if (data[(y * c.width + x) * 4 + 3] > 48) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  // trimY (optional) sets a smaller margin above and below: a wide picture
  // keeps its proportions when the frame it is drawn in is short.
  const side = Math.max(x1 - x0, y1 - y0);
  const m = Math.round(spec.trim * side), mY = Math.round((spec.trimY ?? spec.trim) * side);
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - mY);
  x1 = Math.min(c.width - 1, x1 + m); y1 = Math.min(c.height - 1, y1 + mY);
  const out = document.createElement("canvas");
  out.width = x1 - x0 + 1;
  out.height = y1 - y0 + 1;
  out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
};
/**
 * A turntable frame with motion blur: the shoe rendered at each of spec.rotations (angles spread
 * across the shutter, round the frame's own) and the renders averaged, colour weighted by
 * coverage (premultiplied), so a moving edge fades as a real camera would record it. Returns the
 * frame as PNG, the same frame drawn smaller (spec.small: [width, height], for phones), and the
 * box round the shoe and its shadow (alpha above 24) in the large frame's pixels.
 */
window.renderBlurred = (spec) => {
  const { width: w, height: h } = spec;
  const n = w * h;
  const acc = new Float32Array(n * 4);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  for (const rotationY of spec.rotations) {
    window.renderStill({ ...spec, rotationY, raw: true });
    g.clearRect(0, 0, w, h);
    g.drawImage(renderer.domElement, 0, 0);
    const d = g.getImageData(0, 0, w, h).data;
    for (let i = 0; i < n * 4; i += 4) {
      const a = d[i + 3];
      if (!a) continue;
      acc[i] += d[i] * a; acc[i + 1] += d[i + 1] * a; acc[i + 2] += d[i + 2] * a; acc[i + 3] += a;
    }
  }
  const k = spec.rotations.length;
  const image = g.createImageData(w, h);
  const out = image.data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0, p = 0; i < n * 4; i += 4, p++) {
    const sum = acc[i + 3];
    const a = Math.round(sum / k);
    // the shadow's faint tails (alpha 1 to 3) would draw a ghost of the ground's square on a light page
    if (a <= 3) continue;
    out[i] = Math.round(acc[i] / sum); out[i + 1] = Math.round(acc[i + 1] / sum); out[i + 2] = Math.round(acc[i + 2] / sum); out[i + 3] = a;
    if (a > 24) {
      const x = p % w, y = (p - x) / w;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  g.putImageData(image, 0, 0);
  const result = { png: c.toDataURL("image/png"), box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1] };
  if (spec.small) {
    const s = document.createElement("canvas");
    [s.width, s.height] = spec.small;
    const sg = s.getContext("2d");
    sg.imageSmoothingEnabled = true;
    sg.imageSmoothingQuality = "high";
    sg.drawImage(c, 0, 0, s.width, s.height);
    result.small = s.toDataURL("image/png");
  }
  return result;
};
window.modelSize = [size.x, size.y, size.z];
window.ready = true;
</script>
</body>
</html>
