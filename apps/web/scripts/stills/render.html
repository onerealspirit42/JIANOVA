<!doctype html>
<!--
  Studio renderer for the home page's shoe stills. Opened by render-stills.mjs
  in headless Chromium; not part of the website. It loads the same GLB the
  configurator uses, so new stills come from the real model once it arrives.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(-3, 6, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(4, 3, -5);
scene.add(rim);

/** A soft oval shadow under the sole, so the shoe sits on the page's ground. */
function shadowPlane(width, depth) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, "rgba(28,16,41,0.42)");
  grad.addColorStop(0.55, "rgba(28,16,41,0.16)");
  grad.addColorStop(1, "rgba(28,16,41,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }),
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = 0.002;
  return plane;
}

const modelUrl = new URLSearchParams(location.search).get("m") ?? "/public/models/shoe-placeholder.glb";
const gltf = await new GLTFLoader().loadAsync(modelUrl);
const shoe = gltf.scene;
const box = new THREE.Box3().setFromObject(shoe);
const size = box.getSize(new THREE.Vector3());
shoe.position.y -= box.min.y;
scene.add(shoe);
scene.add(shadowPlane(size.x * 1.25, size.z * 1.9));

const meshes = {};
shoe.traverse((o) => {
  if (o.isMesh) {
    o.material = o.material.clone();
    meshes[o.name] = o;
  }
});

/**
 * spec: { width, height, colors: {part: hex}, highlight?: part,
 *         camera: [x,y,z], target: [x,y,z], fov }
 * Returns a PNG data URL with a transparent background.
 */
window.renderStill = (spec) => {
  for (const [name, mesh] of Object.entries(meshes)) {
    const hex = spec.colors[name];
    if (hex) mesh.material.color.set(hex);
    mesh.material.emissive?.set(name === spec.highlight ? "#b9a4d6" : "#000000");
    if (mesh.material.emissive) mesh.material.emissiveIntensity = name === spec.highlight ? 0.55 : 0;
  }
  renderer.setSize(spec.width, spec.height, false);
  const camera = new THREE.PerspectiveCamera(spec.fov ?? 20, spec.width / spec.height, 0.1, 100);
  camera.position.set(...spec.camera);
  camera.lookAt(new THREE.Vector3(...spec.target));
  renderer.render(scene, camera);
  if (!spec.trim) return renderer.domElement.toDataURL("image/png");

  // Trim to the shoe and its shadow (alpha above a small threshold), keeping
  // `spec.trim` (a share of the size) as a margin on every side.
  const c = document.createElement("canvas");
  c.width = spec.width;
  c.height = spec.height;
  const g = c.getContext("2d");
  g.drawImage(renderer.domElement, 0, 0);
  const { data } = g.getImageData(0, 0, c.width, c.height);
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < c.width; x++)
      if (data[(y * c.width + x) * 4 + 3] > 24) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  const m = Math.round(spec.trim * Math.max(x1 - x0, y1 - y0));
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
  x1 = Math.min(c.width - 1, x1 + m); y1 = Math.min(c.height - 1, y1 + m);
  const out = document.createElement("canvas");
  out.width = x1 - x0 + 1;
  out.height = y1 - y0 + 1;
  out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
};
window.modelSize = [size.x, size.y, size.z];
window.ready = true;
</script>
</body>
</html>
